<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти | Ваша Пекарня</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <!-- Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Italianno&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Sofia+Sans:ital,wght@0,1..1000;1,1..1000&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
    </style>
    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Placeholder для шапки -->
    <div id="header-placeholder"></div>

    <main class="contact-page-wrapper">
        <!-- Заголовок сторінки -->
        <div class="contact-header">
            <h1 class="p">Зв'яжіться з нами</h1>
            <p>Завжди раді відповісти на ваші запитання та допомогти з вибором</p>
        </div>

        <!-- Основна сітка: Інформація + Форма -->
        <div class="contact-grid">
            
            <!-- Ліва колонка: Контактні дані -->
            <div class="contact-card">
                <h2 style="font-family: 'Playfair Display', serif; color: var(--text1); margin-bottom: 30px;">Наші контакти</h2>
                
                <div class="contact-info-item">
                    <div class="contact-icon-wrapper">
                        <i class="ti ti-map-pin"></i>
                    </div>
                    <div class="contact-text">
                        <h4>Адреса</h4>
                        <p>вул. Пекарська, 15, м. Київ</p>
                    </div>
                </div>

                <div class="contact-info-item">
                    <div class="contact-icon-wrapper">
                        <i class="ti ti-phone"></i>
                    </div>
                    <div class="contact-text">
                        <h4>Телефон</h4>
                        <p><a href="tel:+380991234567">+38 (099) 123-45-67</a></p>
                    </div>
                </div>

                <div class="contact-info-item">
                    <div class="contact-icon-wrapper">
                        <i class="ti ti-mail"></i>
                    </div>
                    <div class="contact-text">
                        <h4>Електронна пошта</h4>
                        <p><a href="mailto:hello@bakery.com">hello@bakery.com</a></p>
                    </div>
                </div>

                <div class="contact-info-item">
                    <div class="contact-icon-wrapper">
                        <i class="ti ti-clock"></i>
                    </div>
                    <div class="contact-text">
                        <h4>Години роботи</h4>
                        <p>Пн-Нд: 08:00 - 21:00</p>
                    </div>
                </div>
            </div>

            <!-- Права колонка: Форма зворотного зв'язку -->
            <div class="contact-card">
                <h2 style="font-family: 'Playfair Display', serif; color: var(--text1); margin-bottom: 30px;">Напишіть нам</h2>
                <form action="#" method="POST">
                    <input type="text" class="custom-input" placeholder="Ваше ім'я" required>
                    <input type="email" class="custom-input" placeholder="Ваш Email" required>
                    <input type="text" class="custom-input" placeholder="Тема повідомлення">
                    <textarea class="custom-input" placeholder="Ваше повідомлення..." required></textarea>
                    
                    <!-- Використано твою кнопку з CSS -->
                    <button type="submit" class="add-to-cart-big" style="width: 100%; justify-content: center; margin-top: 10px;">
                        <i class="ti ti-send"></i> Відправити
                    </button>
                </form>
            </div>
        </div>

        <!-- Секція з картою -->
        <div class="map-section">
            <div class="map-container">
                <!-- Вставлено Google Карту. Зміни src на свою реальну адресу в Google Maps -->
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2540.504386762283!2d30.520464875960012!3d50.45032549221199!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x40d4ce50f8b6e3c3%3A0xb528cb4afebcb8a4!2sMaidan%20Nezalezhnosti%2C%20Kyiv%2C%20Ukraine%2C%2002000!5e0!3m2!1sen!2sus!4v1714488000000!5m2!1sen!2sus" 
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>
    </main>

    <!-- Footer placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Плаваюча кнопка кошика для мобільних -->
<a href="cart.html" class="floating-cart" id="mobileCartBtn">
  <i class="ti ti-shopping-cart"></i>
</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  fetch('footer.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('footer-placeholder').innerHTML = data;
    });
</script>

<script>
fetch("header.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("header-placeholder").innerHTML = data;
  });

  function buttonMenu() {
    window.location.href = "menu.html";
  }

  document.addEventListener("DOMContentLoaded", () => {
    const reveals = document.querySelectorAll(".reveal");

    const revealOptions = {
        threshold: 0.1, // Ефект спрацює, коли на екрані з'явиться 10% об'єкта
        rootMargin: "0px 0px -50px 0px" // Анімація почнеться трохи вище нижнього краю екрана
    };

    const revealOnScroll = new IntersectionObserver(function(entries, observer) {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add("active");
                observer.unobserve(entry.target); // Відмикаємо після появи, щоб не анімувалося туди-сюди
            }
        });
    }, revealOptions);

    reveals.forEach(reveal => {
        revealOnScroll.observe(reveal);
    });
});
</script>
</body>
</html>
