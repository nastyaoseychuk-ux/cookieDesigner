<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Italianno&display=swap');
    </style>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sofia+Sans:ital,wght@0,1..1000;1,1..1000&display=swap');
    </style>
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
/>
</head>
<body>
  <div id="header-placeholder"></div>
        <script>
            fetch("header.html")
            .then(res => res.text())
            .then(data => {
            document.getElementById("header-placeholder").innerHTML = data;
            });
        </script>
    </div>

<main class="designer-section">
    <div class="designer-container">
        <aside class="designer-preview">
            <div class="preview-sticky-card">
                <div class="badge">Твій вибір</div>
                
                <div class="cookie-display-frame">
                    <img id="base" src="images/constructor/placeholder.png" alt="Cookie Preview">
                </div>

                <div class="selection-summary">
                    <div class="summary-info">
                        <h3>Конфігурація:</h3>
                        <p id="summaryText">Почніть обирати інгредієнти...</p>
                    </div>
                    
                    <div class="price-action">
                        <div class="price-tag">
                            <span>Сума:</span>
                            <strong id="totalPrice">0 грн</strong>
                        </div>
                        <button id="addToCartBtn" class="add-to-cart-big" onclick="addCustomToCart()" disabled>
                            <i class="ti ti-shopping-cart"></i> Додати у кошик
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <section class="designer-options">
            <div class="option-group">
                <div class="group-header">
                    <span class="group-step">01</span>
                    <h2>Форма печива</h2>
                </div>
                <div class="options-grid" id="shapes"></div>
            </div>

            <div class="option-group">
                <div class="group-header">
                    <span class="group-step">02</span>
                    <h2>Основа (Тісто)</h2>
                </div>
                <div class="options-grid" id="doughs"></div>
            </div>

            <div class="option-group">
                <div class="group-header">
                    <span class="group-step">03</span>
                    <h2>Колір глазурі</h2>
                </div>
                <div class="options-grid" id="icings"></div>
            </div>

            <div class="option-group">
                <div class="group-header">
                    <span class="group-step">04</span>
                    <h2>Декор (Посипка)</h2>
                </div>
                <div class="options-grid" id="toppings"></div>
            </div>
        </section>
    </div>
</main>

  <div id="footer-placeholder"></div>
  <script>
  fetch('footer.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('footer-placeholder').innerHTML = data;
    });
</script>

<script>
fetch("header.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("header-placeholder").innerHTML = data;
  });
</script>

  <script src="script.js"></script>
  <script src="cart.js"></script>

</body>
</html>
