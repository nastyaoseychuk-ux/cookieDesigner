<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Italianno&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Sofia+Sans:ital,wght@0,1..1000;1,1..1000&display=swap');
    </style>
</head>
<body>

    <script>
        fetch("header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header-placeholder").innerHTML = data;
        });
    </script>
    <div id="header-placeholder"></div>

    <div class="cart-container container7">
        <div class="cart-layout">
            <div id="cartItems" class="cart-items-wrapper"></div>

            <div class="cart-summary">
                <h3>Замовлення</h3>
                <div class="summary-row">
                    <span>Товари:</span>
                    <span id="itemsCount">0 шт.</span>
                </div>
                <div class="summary-row">
                    <span>Знижка:</span>
                    <span>0 грн</span>
                </div>
                <div class="summary-total">
                    <span>Разом:</span>
                    <span id="totalPrice">0 грн</span>
                </div>
                <button class="btn-custom btn-checkout">Оформити замовлення</button>
            </div>
        </div>
    </div>

    <!-- Модальне вікно -->
    <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background: var(--background); border-radius: 25px; border: none; box-shadow: var(--shadow);">
                <div class="modal-header" style="border-bottom: 1px solid rgba(139, 94, 60, 0.1);">
                    <h5 class="modal-title" style="font-family: 'Playfair Display', serif; color: var(--text2); font-weight: 700;">Оформлення замовлення</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="padding: 30px;">
                    <form id="orderForm">
                        <div class="mb-3">
                            <label class="form-label" style="color: var(--text2); font-weight: 500;">Ваше ім'я</label>
                            <input type="text" class="form-control" id="userName" required style="border-radius: 10px; border: 1px solid rgba(139, 94, 60, 0.2);">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="color: var(--text2); font-weight: 500;">Прізвище</label>
                            <input type="text" class="form-control" id="userSurname" required style="border-radius: 10px; border: 1px solid rgba(139, 94, 60, 0.2);">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="color: var(--text2); font-weight: 500;">Номер телефону</label>
                            <input type="tel" class="form-control" id="userPhone" placeholder="+380" required style="border-radius: 10px; border: 1px solid rgba(139, 94, 60, 0.2);">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="color: var(--text2); font-weight: 500;">Адреса доставки</label>
                            <textarea class="form-control" id="userAddress" rows="2" required style="border-radius: 10px; border: 1px solid rgba(139, 94, 60, 0.2);"></textarea>
                        </div>
                        <button type="submit" class="btn-custom w-100" style="margin-top: 10px; padding: 12px;">Підтвердити замовлення</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
    const reveals = document.querySelectorAll(".reveal");

    const revealOptions = {
        threshold: 0.1, // Ефект спрацює, коли на екрані з'явиться 10% об'єкта
        rootMargin: "0px 0px -50px 0px" // Анімація почнеться трохи вище нижнього краю екрана
    };

    const revealOnScroll = new IntersectionObserver(function(entries, observer) {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add("active");
                observer.unobserve(entry.target); // Відмикаємо після появи, щоб не анімувалося туди-сюди
            }
        });
    }, revealOptions);

    reveals.forEach(reveal => {
        revealOnScroll.observe(reveal);
    });
});
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cart.js"></script>
</body>
</html>
